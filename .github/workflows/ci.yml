# Automatic checks on every pull request. The three job NAMES below ("API build", "Web build", "No secrets") are the names the ruleset in
# .github/rulesets/protect-main.json waits for. If you rename a job here, rename it there too, or pull requests will wait forever.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: API/package-lock.json
      - name: Install (the same as Railway)
        run: npm ci
      - name: Build (the same as Railway)
        run: npm run build
      - name: Tests, if the project has any
        run: npm test --if-present

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests, if the project has any
        run: npm test --if-present

  secrets:
    name: No secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for keys, passwords and env files in this change
        run: bash .github/scripts/check-no-secrets.sh "origin/${{ github.base_ref || 'main' }}"