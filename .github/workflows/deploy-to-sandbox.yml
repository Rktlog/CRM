# The SANDBOX hands itself out. Anyone who can add labels (the team) adds the label "sandbox" to their pull request when it is ready to try.
#
#  - There is one sandbox and it holds one change at a time. If another pull request holds it, the label comes off again with a comment saying who has it.
#  - While a pull request holds the sandbox, every new commit pushed to it updates the sandbox by itself.
#  - When that pull request is closed or merged the sandbox is released and goes back to the live code (main).
#  - The rule is the same for everybody, the owner too. To take the sandbox over, take the label off the other pull request, then add it to yours. So it is safe
#    for Claude to add the label, whoever's GitHub login it is working under.
#
# Safe by design: this uses pull_request_target, so it always runs the version of this file that is on main, which a pull request cannot change. It only copies a
# branch onto "staging"; it never runs the pull request's own code here. Pushes made with the built-in token do not start other workflows. The sandbox holds only
# made-up data and sandbox settings, and the API refuses to start if it is ever pointed at the live system.
name: Sandbox

on:
  pull_request_target:
    types: [labeled, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

# One at a time, in the order they arrive (never cancel one halfway through).
concurrency:
  group: sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    name: Update the sandbox
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'sandbox') ||
       (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'sandbox')) ||
       (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'sandbox')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claim, update or release the sandbox
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: bash .github/scripts/sandbox-deploy.sh
